<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAGO EN LÍNEA</title>

  <style>
    body {
      background: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contenedor-pago {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 90%;
    }

    .contenedor-pago h1 {
      text-align: center;
      color: #4a2e2e;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .formulario-pago {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo label {
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    .campo input,
    .campo select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .campo input:focus,
    .campo select:focus {
      border-color: #a87c6f;
      outline: none;
    }

    .doble-campo {
      display: flex;
      gap: 20px;
    }

    .doble-campo .campo {
      flex: 1;
    }

    button {
      background-color: #6f3e3e;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #8c4d4d;
    }
  </style>
</head>

<body>
  <div class="contenedor-pago">
    <h1>PAGO EN LÍNEA</h1>

    <form class="formulario-pago">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required />
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@email.com" required />
      </div>

      <div class="campo">
        <label for="numeroTarjeta">Número de tarjeta</label>
        <input type="text" id="numeroTarjeta" maxlength="19" placeholder="1234 5678 9012 3456" required />
      </div>

      <div class="doble-campo">
        <div class="campo">
          <label for="expiracion">Fecha de expiración</label>
          <input type="month" id="expiracion" required />
        </div>

        <div class="campo">
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" maxlength="4" placeholder="123" required />
        </div>
      </div>

      <div class="campo">
        <label for="metodo">Método de pago</label>
        <select id="metodo">
          <option value="credito">Tarjeta de Crédito</option>
          <option value="debito">Tarjeta de Débito</option>
          <option value="paypal">PayPal</option>
        </select>
      </div>

      <button type="submit">Realizar Pago</button>
      <a href="index.html" class="btn-regresar">← Regresar a la página principal</a>
    </form>
  </div>
  
</body>


</html>
