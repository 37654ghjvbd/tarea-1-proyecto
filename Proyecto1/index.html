<body>

  <!-- MODAL DE LOGIN -->
  <div id="modalLogin" class="modal">
    <div class="modal-contenido">
      <h2>Iniciar Sesión</h2>
      <input type="text" id="usuario" placeholder="Usuario"><br>

      <button onclick="iniciarSesion()">Ingresar</button>

          <a href=""><img class="imgLink" src="img/SC-INSTAGRAM.png" alt="instagram"></a>

      </div>

      <!-- Navegación -->

        <a href=""><img src="img/SC-LOGO-HORIZONTAL.png" alt=""></a>
        <div id="navLinks">
          <a href="">NOSOTROS</a>

          <a href="">MENÚ</a>

          <a href="javascript:void(0);" onclick="abrirModal()">INICIAR SESIÓN</a>
        </div>
      </nav>

      <!-- Carrusel -->
      <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="img/KV-DMadre25-Web-Banner-V1-1536x736.jpg" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="img/Galatea-Web-Banner-min-1536x736.jpg" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="img/Kandu-2023-Web-Banner-min-1536x736.jpg" class="d-block w-100" alt="...">
          </div>

            <img src="img/Frappelatte-Cafe-Intenso-SweetCoffee-banner-1536x736.jpg" class="d-block w-100" alt="...">

            <img src="img/BANNER-BROWNIE-COFFEE-SUNDAE-1536x736.jpg" class="d-block w-100" alt="...">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>

    <main>
      <!-- Aquí puedes continuar con tus secciones como estaban -->
      <section id="banner">

        </a>
      </section>
    </main>

    <footer>
      <img class="footer" src="img/FinFooternew.jpg" alt="">
    </footer>
  </div>

  <!-- SCRIPT DE LOGIN -->
  <script>
    function iniciarSesion() {
      const user = document.getElementById('usuario').value;
      const pass = document.getElementById('contrasena').value;
      const mensajeError = document.getElementById('mensajeError');

      if (user === 'admin' && pass === '1234') {
        document.getElementById('modalLogin').style.display = 'none';
      } else {
        mensajeError.textContent = "Usuario o contraseña incorrectos";
      }
    }

    function abrirModal() {
      document.getElementById('modalLogin').style.display = 'flex';
    }
  </script>

</body>

</html>
